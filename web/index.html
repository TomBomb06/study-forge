<style>
  :root{
    --bg:#070d1a; --surface:#0e1626; --surface-2:#142033; --surface-3:#1b2b42;
    --border:#1d2c42; --border-2:#2b3c56;
    --text:#eef2f8; --muted:#93a3ba; --faint:#64748b;
    --brand:#2f6fed; --brand-2:#58a6ff; --brand-ink:#9ec5ff;
    --good:#3ecf8e; --bad:#ff5c7c; --warn:#ffb454;
    --radius:16px; --radius-sm:12px;
    --shadow:0 4px 22px -8px rgba(0,0,0,.55);
    --shadow-lg:0 26px 60px -14px rgba(0,0,0,.62);
    --glow:0 0 0 1px rgba(47,111,237,.35),0 10px 34px -8px rgba(47,111,237,.42);
    --grad:linear-gradient(135deg,var(--brand),var(--brand-2));
  }
  *{box-sizing:border-box}
  .card.owned-plan{border-color:var(--brand);box-shadow:var(--glow)}
  /* Inline icons: sized from the text they sit in, coloured by it too. */
  svg.ic{width:1em;height:1em;vertical-align:-0.125em;flex:none}
  /* Icon slots that used to hold an emoji glyph and were sized by font-size. */
  .lp-feat .fi svg.ic, .mode>.ic svg.ic{width:1em;height:1em}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
    border-radius:50%;background:var(--surface-3);color:var(--muted);font-size:15px}
  .rank1{background:rgba(255,209,102,.16);color:#ffd166}
  .rank2{background:rgba(203,213,225,.16);color:#cbd5e1}
  .rank3{background:rgba(217,142,86,.16);color:#d98e56}
  .lives{display:inline-flex;gap:3px;align-items:center}
  .lives .life{color:#ff5c7c;display:inline-flex;font-size:17px}
  .lives .life.off{color:var(--border-2)}
  .ic+*{margin-left:.1em}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;height:100%;max-width:100%;overflow-x:hidden}
  img,video,canvas,svg,pre,textarea{max-width:100%}
  .card,.notes,.mode,p,h1,h2,li{overflow-wrap:anywhere}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.55;letter-spacing:-.006em;position:relative}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(1100px 620px at 50% -20%,rgba(47,111,237,.10),transparent 60%)}
  h1,h2,.brand,.lp-h1,.big-score,.mode .nm,.lp-plan .pp{font-family:Sora,Inter,sans-serif}
  #app{min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:26px 24px}
  button{font-family:inherit;cursor:pointer;border:none}
  .btn{position:relative;background:var(--grad);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:15px;letter-spacing:-.01em;box-shadow:0 6px 18px -6px rgba(47,111,237,.55),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .1s ease,box-shadow .2s ease,opacity .2s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 11px 26px -6px rgba(47,111,237,.7),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn:active{transform:translateY(0) scale(.97)}
  .mode:active,.set-item:active,.choice:active:not(:disabled),.match-item:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);box-shadow:none}
  .btn.ghost:hover{border-color:var(--border-2);background:var(--surface-3)}
  /* eye-catching top-bar upgrade button */
  .btn.premium{background:linear-gradient(120deg,#f4c257,#e0a032);color:#231703;font-weight:800;border:none;box-shadow:0 6px 18px -8px rgba(224,160,50,.6),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.premium:hover{box-shadow:0 10px 24px -8px rgba(224,160,50,.75),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn.premium.owned{background:transparent;color:var(--brand-ink);border:1px solid var(--border-2);box-shadow:none;font-weight:700}
  .btn.premium.owned:hover{border-color:var(--brand);box-shadow:none}
  /* premium tutor */
  .btn.teach{background:linear-gradient(135deg,#2f6fed,#58a6ff);color:#fff;border:none;box-shadow:0 5px 16px -6px rgba(47,111,237,.7)}
  .btn.teach:hover{transform:translateY(-1px)}
  .btn.teach.locked{background:var(--surface-2);color:var(--brand-ink);border:1px dashed rgba(47,111,237,.55);box-shadow:none}
  .card.tutor{border-color:rgba(47,111,237,.4);line-height:1.6;animation:fadein .3s ease}
  .card.tutor h1,.card.tutor h2,.card.tutor h3{margin:.7em 0 .35em;font-size:17px}
  .card.tutor strong{color:var(--brand-ink)}
  /* voice picker */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
  .voicecard{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 12px 10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .voicecard:hover{border-color:var(--border-2)}
  .voicecard.active{border-color:var(--brand);box-shadow:var(--glow)}
  .voicecard .vn{font-weight:700;font-size:15px}
  .voicecard .vd{font-size:12px;color:var(--muted);margin:2px 0 8px;line-height:1.3}
  .tutor-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--brand-ink);border:1px solid rgba(47,111,237,.5);border-radius:99px;padding:2px 9px;margin-bottom:8px}
  .btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
  input,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;font-size:15px;font-family:inherit;transition:border-color .15s,box-shadow .15s;}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.18)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.03)}
  .muted{color:var(--muted)}
  .row{display:flex;gap:12px;align-items:center}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.03em}
  .brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  header.top{border-bottom:1px solid var(--border);background:rgba(7,13,26,.72);backdrop-filter:blur(12px) saturate(1.4);position:sticky;top:0;z-index:5}
  .top .wrap{display:flex;justify-content:space-between;align-items:center;padding:15px 24px}
  .hidden{display:none!important}
  .center{min-height:100%;display:flex;align-items:center;justify-content:center;flex:1}
  h1{font-size:29px;font-weight:800;letter-spacing:-.032em;margin:0 0 6px;background:linear-gradient(180deg,#fff,#c3d0e2);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .error{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
  .tabs{display:flex;gap:6px;background:var(--surface-2);padding:6px;border-radius:14px;border:1px solid var(--border)}
  .tab{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;transition:.15s}
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px rgba(47,111,237,.6)}
  .dropzone{border:1.5px dashed var(--border-2);border-radius:var(--radius);padding:44px 24px;text-align:center;transition:.18s;cursor:pointer;background:var(--surface)}
  .dropzone:hover,.dropzone.drag{border-color:var(--brand);background:var(--surface-2);box-shadow:var(--glow)}
  .set-item{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:var(--surface);cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
  .set-item:hover{border-color:var(--brand-2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  /* chooser grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
  .mode{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.16s;text-align:left;overflow:hidden;box-shadow:var(--shadow)}
  .mode::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:.16s;box-shadow:inset 0 0 0 1px rgba(47,111,237,.45)}
  .mode:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode:hover::after{opacity:1}
  .mode>.ic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:13px 15px 12px 16px;font-size:22px;background:rgba(47,111,237,.14);border:1px solid rgba(47,111,237,.22);transform:rotate(-3deg);transition:transform .18s}
  .mode:nth-child(even) .ic{transform:rotate(2.5deg)}
  .mode:hover .ic{transform:rotate(0) scale(1.08)}
  .mode .nm{font-weight:700;margin-top:12px;font-size:16px;letter-spacing:-.01em}
  .mode .ds{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45}
  .mode .soon{display:inline-block;margin-top:10px;font-size:11px;color:var(--brand-ink);background:rgba(47,111,237,.1);border:1px solid rgba(47,111,237,.22);border-radius:99px;padding:2px 9px;font-weight:600}
  .mode:nth-child(2) .ic{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.28)}
  .mode:nth-child(3) .ic{background:rgba(62,207,142,.15);border-color:rgba(62,207,142,.28)}
  .mode:nth-child(4) .ic{background:rgba(255,180,84,.15);border-color:rgba(255,180,84,.28)}
  .mode:nth-child(5) .ic{background:rgba(255,92,124,.15);border-color:rgba(255,92,124,.28)}
  .mode:nth-child(6) .ic{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.28)}
  .mode:nth-child(7) .ic{background:rgba(62,207,142,.15);border-color:rgba(62,207,142,.28)}
  .flash{perspective:1200px;height:280px;margin:16px 0;cursor:pointer;user-select:none}
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;font-size:19px;font-weight:500;box-shadow:var(--shadow)}
  .flash-back{transform:rotateY(180deg);background:var(--surface-2)}
  .flash-tag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--brand-ink);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .choice{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:15px;transition:.13s}
  .choice:hover:not(:disabled){border-color:var(--brand);background:var(--surface-3)}
  .choice.correct{border-color:var(--good);background:rgba(62,207,142,.14)}
  .choice.wrong{border-color:var(--bad);background:rgba(255,92,124,.14)}
  .choice:disabled{cursor:default}
  .progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:14px 0;border:1px solid var(--border)}
  .progress>div{height:100%;background:var(--grad);transition:width .35s ease;box-shadow:0 0 12px rgba(47,111,237,.5)}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .notes{font-size:16px;line-height:1.78}
  .notes h1,.notes h2,.notes h3{margin:20px 0 8px;color:var(--text);-webkit-text-fill-color:currentColor}
  .notes ul{margin:8px 0;padding-left:22px}
  .notes li{margin:5px 0}
  .notes strong{color:#fff}
  #cookiebar{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:var(--surface-2);
    border-top:1px solid var(--border);box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:14px 16px}
  #cookiebar .cb-inner{max-width:900px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  #cookiebar .cb-text{flex:1;min-width:260px;font-size:13.5px;line-height:1.55;color:var(--muted)}
  #cookiebar .cb-btns{display:flex;gap:10px}
  .btn.ghost{background:transparent;border:1px solid var(--border-2);color:var(--text)}
  .lp-navlinks a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
  .lp-navlinks a:hover{color:var(--text)}
  @media (max-width:820px){ .lp-navlinks{display:none} }
  .faq{max-width:760px;margin:0 auto;text-align:left}
  .faq details{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 20px;margin-bottom:12px}
  .faq details[open]{border-color:rgba(47,111,237,.45)}
  .faq summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;position:relative;padding-right:28px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";position:absolute;right:2px;top:-2px;font-size:22px;color:var(--brand-ink);font-weight:700}
  .faq details[open] summary::after{content:"−"}
  .faq p{color:var(--muted);font-size:14.5px;margin:12px 0 2px}
  .sticky-cta{position:fixed;left:12px;right:12px;bottom:12px;z-index:900;display:none;
    align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:16px;
    box-shadow:0 10px 34px rgba(0,0,0,.5)}
  .sticky-cta .sc-text{display:flex;flex-direction:column;line-height:1.3}
  .sticky-cta .sc-text b{font-size:15px}
  .sticky-cta .sc-text span{font-size:12px;color:var(--muted)}
  @media (max-width:720px){ .sticky-cta.show{display:flex} }
  .pill{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--muted);font-weight:600}
  /* Math solver: the answer is the reward, the locked steps are the pitch. */
  .mathres{border-color:rgba(47,111,237,.45)}
  .manswer{font-family:Sora,Inter,sans-serif;font-size:34px;font-weight:800;letter-spacing:-.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    margin:2px 0 16px;word-break:break-word}
  .mstep-head{font-weight:700;font-size:14px;margin-bottom:8px}
  ol.msteps{margin:0;padding-left:20px;font-size:14.5px;line-height:1.6}
  ol.msteps li{margin:7px 0}
  .mcheck{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--surface-2);
    border:1px solid var(--border);font-size:13px;color:var(--muted)}
  .msteps-lock{border-top:1px solid var(--border);padding-top:14px}
  .mblurwrap{position:relative;margin-bottom:6px}
  .mstep-blur{font-size:14.5px;line-height:1.6;color:var(--muted);margin:7px 0;
    filter:blur(4.5px);user-select:none;pointer-events:none}
  .mstep-blur:first-child{filter:blur(2.5px)}
  .mfade{position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--surface) 82%)}
  .stack>*+*{margin-top:12px}
  .big-score{font-size:46px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  a.link{color:var(--brand-2);cursor:pointer;text-decoration:none;font-weight:600}
  }
  /* Standalone .link controls (Back, etc.) are navigation, not inline prose
     links — give them a real 24px+ tap target without shifting the layout. */
  a.link{display:inline-flex;align-items:center;gap:.3em;min-height:24px}
  a.link:focus-visible,[role="button"]:focus-visible,button:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
  a.link:hover{text-decoration:underline}
  /* video slideshow */
  .slide{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:600;line-height:1.5;padding:30px}
  /* matching */
  .match-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .match-item{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);cursor:pointer;transition:.13s;font-size:15px}
  .match-item:hover{border-color:var(--brand);background:var(--surface-3)}
  .match-item.sel{border-color:var(--brand);background:rgba(47,111,237,.18);box-shadow:var(--glow)}
  .match-item.done{border-color:var(--good);background:rgba(62,207,142,.12);cursor:default;opacity:.65}
  .match-item.bad{border-color:var(--bad);background:rgba(255,92,124,.15)}
  input[type=range]{accent-color:var(--brand)}
  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--surface-3);border:1px solid var(--border-2);color:var(--text);padding:12px 18px;
    border-radius:12px;font-size:14px;font-weight:500;z-index:50;transition:.25s;pointer-events:none;max-width:90vw;box-shadow:var(--shadow-lg)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.bad{border-color:var(--bad)} #toast.good{border-color:var(--good)}
  .adbox{border:1px dashed var(--border-2);border-radius:14px;padding:18px;text-align:center;background:var(--surface)}
  .adbox .tag{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  #adgate{position:fixed;inset:0;z-index:9999;background:rgba(5,10,21,.78);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}
  #adgate .sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:440px;width:100%;padding:22px;box-shadow:var(--shadow-lg)}
  #adgate .tag{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  #adgate .adslot{min-height:180px;margin:12px 0;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden}
  #adgate .gate-actions{display:flex;align-items:center;gap:10px;margin-top:6px}
  #adgate .skip{margin-left:auto}
  .empty{text-align:center;padding:40px 20px}
  .empty .big{font-size:44px} .empty h2{margin:14px 0 6px}
  .steps{display:flex;flex-direction:column;gap:10px;max-width:430px;margin:18px auto 0;text-align:left}
  .step{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;box-shadow:var(--shadow)}
  .step .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

const API="";

async function api(path,{method="GET",body=null,form=null}={}){
  const headers={}; if(state.token) headers["Authorization"]="Bearer "+state.token;
  let payload=null;
  if(form){payload=form;} else if(body){headers["Content-Type"]="application/json";payload=JSON.stringify(body);}
  let res;
  try{ res=await fetch(API+path,{method,headers,body:payload}); }

  const t=await res.text(); let d=null; try{d=t?JSON.parse(t):null;}catch{d=t;}

    const m=(d&&d.detail);
    let msg=null;
    if(typeof m==="string") msg=m;
    // pydantic returns detail as a list of {msg, loc}; showing the raw status

    else if(Array.isArray(m)&&m.length) msg=(m[0]&&(m[0].msg||m[0].detail))||null;

// ---------- Voice (read-aloud) ----------
async function loadVoiceOptions(){
  if(state.voiceOpts!==undefined) return state.voiceOpts;
  try{ state.voiceOpts=await api("/voice/options"); }catch{ state.voiceOpts=null; }
  return state.voiceOpts;
}
// Device (browser) voices — populated async on some browsers.
function deviceVoices(){
  let list=[]; try{ list=window.speechSynthesis?window.speechSynthesis.getVoices():[]; }catch{ list=[]; }
  // Prefer English, natural-sounding ones; push obviously-robotic ones down.
  const good=/(natural|neural|siri|google|samantha|aaron|allison|ava|zoe|serena|daniel|karen|moira|premium|enhanced)/i;
  return list.filter(v=>/^en(-|_|$)/i.test(v.lang)||/english/i.test(v.name))
             .sort((a,b)=>(good.test(b.name)?1:0)-(good.test(a.name)?1:0));
}
function bestDeviceVoice(){ const d=deviceVoices(); return d[0]||null; }
function savedVoice(){ try{return localStorage.getItem("sf_voice")||"";}catch{return "";} }
async function saveVoice(id){
  try{localStorage.setItem("sf_voice",id);}catch{}
  state.voicePref=id;
  try{ await api("/me/voice",{method:"POST",body:{voice:id}}); }catch{}
}
// Fetch AI speech for a chunk of text; returns an object URL for an <audio>.
async function ttsFetch(text,voice,speed){
  const res=await fetch(API+"/tts/speak",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+state.token},
    body:JSON.stringify({text,voice,speed:speed||1})});
  if(res.status===402){ const e=await res.json().catch(()=>({})); const err=new Error(e.detail||"Premium"); err.code=402; throw err; }
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.detail||("Voice error "+res.status)); }
  const blob=await res.blob(); return URL.createObjectURL(blob);
}
// Split long notes into speakable chunks at sentence boundaries.
function speechChunks(text,max){
  max=max||3500; const parts=[]; let buf="";
  text.split(/(?<=[.!?])\s+/).forEach(s=>{
    if((buf+" "+s).length>max){ if(buf)parts.push(buf.trim()); buf=s; }
    else buf+=(buf?" ":"")+s;
  });
  if(buf.trim())parts.push(buf.trim());
  return parts.length?parts:[text.slice(0,max)];
}
function currentVoiceLabel(){
  const o=state.voiceOpts, id=state.voicePref||savedVoice();
  if(o&&o.ai_available){ const v=(o.voices||[]).find(x=>x.id===id)||(o.voices||[]).find(x=>x.id===o.default); return v?v.name:"Nova"; }
  if(id) return id.replace(/\s*\(.*\)/,"");
  const b=bestDeviceVoice(); return b?b.name:"Default";
}

      stopSpeech(); const u=new SpeechSynthesisUtterance(SAMPLE);
      const vv=deviceVoices().find(x=>x.name===id); if(vv)u.voice=vv; window.speechSynthesis.speak(u); return;
    }
    const old=b.textContent; b.disabled=true; b.textContent="…";
    try{ const url=await ttsFetch(SAMPLE,id,1); const a=new Audio(url); a.play(); }
    catch(e){ if(e.code===402){renderUpgrade();return;} toast(e.message||"Preview failed","bad"); }
    finally{ b.disabled=false; b.textContent=old; }
  });
}

// tiny markdown -> html (escaped first)
function mdLite(s){
  let h=esc(s);
  h=h.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h2>$1</h2>");
  h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/(^|\n)[-*] (.*)/g,"$1<li>$2</li>");
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,m=>"<ul>"+m.replace(/\n(?!<li>)/g,"")+"</ul>");
  h=h.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
  return h;
}

function wireStickyCta(){

  const io=new IntersectionObserver(entries=>{

  },{threshold:0});
  io.observe(hero);
}

// Timers, polls and audio started by a screen must die when that screen is
// replaced. Without this, a game clock kept ticking after you navigated away
// and then wrote a score + confetti onto whatever screen you were now on (and
// threw, because the elements it wanted were gone).
state._cleanups=[];
function onLeaveScreen(fn){ state._cleanups.push(fn); }
function runCleanups(){
  const list=state._cleanups; state._cleanups=[];
  list.forEach(fn=>{ try{fn();}catch{} });
}
// role="button" elements need Enter/Space wired up by hand, otherwise they are
// mouse-only. One delegated listener covers every screen.
document.addEventListener("keydown",(e)=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const t=e.target;
  if(!t || typeof t.getAttribute!=="function" || t.getAttribute("role")!=="button") return;
  e.preventDefault(); t.click();
});
function shell(inner){
  stopSpeech();
  runCleanups();
  if(state._stopAudio){ try{state._stopAudio();}catch{} state._stopAudio=null; }
  el.innerHTML=`<header class="top"><div class="wrap">

  if(!state.usage) loadUsage();

// Top-bar plan button — ALWAYS visible. Free users get an upgrade CTA;
// paying users get a calmer "Premium" chip that opens their plan to manage.
function updatePremiumBtn(){
  const b=document.getElementById("go-premium"); if(!b) return;
  // Hidden until we actually know the plan. Painting "Go Premium" first and
  // correcting it after the network call is what made a subscriber see their
  // plan flash and then turn back into a buy button on every screen change.
  if(!state.usage){ b.style.visibility="hidden"; return; }
  const plan=state.usage.video&&state.usage.video.plan;
  const paid=plan==="basic"||plan==="pro";
  b.style.visibility="visible";
  b.classList.toggle("owned",paid);
  b.innerHTML=paid?`${ICON.star} ${esc(state.usage.video.plan_name||"Premium")}`
                  :`${ICON.spark} Go Premium`;
  b.title=paid?"Your plan — tap to manage or cancel":"Go Premium — no ads + AI video lessons";
}

function updateSetsNote(){

// Run a premium tutor request into mountEl; free users are sent to the upgrade screen.
async function runTutor(mode,items,mountEl,btn){
  if(state.usage===undefined) await loadUsage();
  if(!isPaidPlan()){ toast("✨ Premium unlocks in-depth tutoring","good"); renderUpgrade(); return; }
  const label=btn?btn.innerHTML:"";
  if(btn){btn.disabled=true;btn.innerHTML=ICON.cap+" Thinking…";}
  if(mountEl) mountEl.innerHTML=`<div class="center" style="min-height:70px"><div class="spinner"></div></div>`;
  try{

    toast(e.message||"The tutor had trouble — try again.","bad");
  }
}

function homeSubLine(){
  const g=state.game; const pool=[];
  if(g){
    const left=Math.max(0,g.goal-g.daily_xp);
    if(g.streak>=3&&!g.goal_met) pool.push(`🔥 ${g.streak}-day streak on the line — ${left} XP saves it.`);
    if(g.goal_met) pool.push("Goal crushed. Everything else today is bonus XP.");
    if(!g.goal_met&&left<=20) pool.push(`So close — just ${left} XP to lock today's streak.`);
    const q=(g.quests||[]).filter(x=>!x.done).length;
    if(q>0) pool.push(`${q} quest${q>1?"s":""} still up for grabs (+${q*30} XP).`);
    if(g.streak===0) pool.push("Day 1 starts with one quiz. That's it.");
  }
  pool.push("What are we mastering today?","Small sessions beat cram sessions.","Future you says thanks.");
  return pick(pool);
}

function maybeSpinWelcome(){
  const g=state.game;
  if(!g||g.spun||_wheelShown) return;
  const prizes=g.spin_prizes||[]; if(!prizes.length) return;
  _wheelShown=true;
  const N=prizes.length, seg=360/N, cols=["#2563eb","#58a6ff"];
  const stops=prizes.map((p,i)=>`${cols[i%2]} ${i*seg}deg ${(i+1)*seg}deg`).join(",");
  const grad=`conic-gradient(from 0deg,${stops})`;
  const labels=prizes.map((p,i)=>`<div class="seg-label" style="transform:rotate(${i*seg+seg/2}deg)"><span>${p.icon}<br>${esc(p.label)}</span></div>`).join("");
  const ov=document.createElement("div"); ov.id="wheelov";
  ov.innerHTML=`<h2>🎉 Welcome spin!</h2>
    <p class="wsub">One free spin, on the house — win XP, coins, a streak freeze, or a discount off premium. Whatever you land on is yours to keep.</p>
    <div class="wheel-wrap"><div class="ptr">▼</div>
      <div class="wheel" id="wheel" style="background:${grad}">${labels}</div>

    <button class="btn ghost sm" id="spin-skip" style="margin-top:10px">Skip for now</button>`;
  document.body.appendChild(ov);
  const wheel=document.getElementById("wheel"), btn=document.getElementById("spin-btn");
  const skipBtn=document.getElementById("spin-skip");
  let done=false;
  // This overlay covers the whole screen and used to have exactly one control.
  // If the spin request hung, the button sat on "Spinning…" forever and the
  // app was unusable until a reload.
  const dismiss=()=>{ document.removeEventListener("keydown",onWheelKey,true); ov.remove(); };
  const onWheelKey=(e)=>{ if(e.key==="Escape"){ e.preventDefault(); dismiss(); } };
  document.addEventListener("keydown",onWheelKey,true);
  if(skipBtn) skipBtn.onclick=dismiss;
  let guard=null;
  btn.onclick=async()=>{
    if(done){ dismiss(); return; }
    btn.disabled=true; btn.textContent="Spinning…";
    let r;
    guard=setTimeout(()=>{ if(!done){ btn.disabled=false; btn.textContent="Spin the wheel"; toast("That took too long — try again.","bad"); } },15000);
    try{ r=await api("/gamify/spin",{method:"POST",body:{tz_offset:tzOff()}}); }
    catch(e){ clearTimeout(guard); if(state.game)state.game.spun=true; toast(e.message||"Couldn't spin right now","bad"); dismiss(); return; }
    clearTimeout(guard);
    const target=360*6-(r.index*seg+seg/2);
    wheel.style.transform=`rotate(${target}deg)`;
    done=true;

      state.game=r.state; updateHUD();
      const p=r.prize; confetti(100);
      const sub=ov.querySelector(".wsub");
      if(sub) sub.innerHTML=`<b style="color:var(--brand-ink);font-size:19px">${p.icon} You won ${esc(p.label)}!</b><br>${winBlurb(p)}`;
      btn.disabled=false; btn.textContent="Awesome — let's study!";

      toast(`${p.icon} You won ${p.label}!`,"good");
      if(r.leveled_up_to) setTimeout(()=>levelUp(r.leveled_up_to),800);
    },4750);
  };
}

// ---------- Cookie consent ----------
// Nothing that sets a third-party cookie (Meta Pixel, AdSense) runs until the
// visitor chooses. "Reject" is a real choice, not a delayed yes: the app works
// fully without consent, you just get non-personalised house ads instead.
function hasConsent(){ try{ return localStorage.getItem("sf_consent")==="accepted"; }catch{ return false; } }
function consentAnswered(){ try{ return !!localStorage.getItem("sf_consent"); }catch{ return true; } }
function setConsent(choice){

  const b=document.getElementById("cookiebar"); if(b) b.remove();
  if(choice==="accepted"){

    try{ if(window.SF_loadGA) window.SF_loadGA(); }catch{}
    // Ads can now load for free users on the next render.
    if(state.showAds && state.ads && state.ads.provider==="adsense") loadAdsenseScript(state.ads.client_id);
  }
}

// ---------- Ads (free users only; paid = no ads) ----------
let _adsenseLoaded=false;
function loadAdsenseScript(clientId){
  // Personalised ads set cookies, so this waits for consent. Without consent
  // we simply show no third-party ads rather than loading them anyway.
  if(!hasConsent())return;
  if(_adsenseLoaded||!clientId)return; _adsenseLoaded=true;
  const sc=document.createElement("script");
  sc.async=true; sc.crossOrigin="anonymous";
  sc.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+encodeURIComponent(clientId);
  document.head.appendChild(sc);
}
// The plan lives here and nowhere else. Two rules matter:
//  * a failed fetch must NEVER overwrite a good answer with "free" — that is
//    how a paying user's Premium state used to vanish mid-session;
//  * concurrent callers share one request, so a page render can't fire two
//    /me/usage calls and let the loser's result win.
let _usageInFlight=null;
async function loadUsage(force){
  if(state.usage && !force && !_usageInFlight) return state.usage;
  if(_usageInFlight) return _usageInFlight;
  _usageInFlight=(async()=>{
    try{ state.usage=await api("/me/usage"); }
    catch{ return state.usage; }   // keep the last known-good plan
    finally{ _usageInFlight=null; }
    applyUsage();
    return state.usage;
  })();
  return _usageInFlight;
}
// Repaint every part of the UI that depends on the plan.
function applyUsage(){
  if(!state.usage) return;
  state.showAds=!!state.usage.show_ads;
  state.ads=state.usage.ads||{};
  state.adPacing=(state.usage.ads&&state.usage.ads.pacing)||{every_actions:3,min_gap_seconds:150,skip_after_seconds:5};
  if(state.showAds && state.ads.provider==="adsense") loadAdsenseScript(state.ads.client_id);
  updatePremiumBtn(); updateSetsNote();
}

// ---------- Paced ad breaks (free users only) ----------
// A light, skippable full-screen ad shown between study actions — every Nth
// action and never more often than the min gap. Paid users never see it.
function _adCount(){ return parseInt(localStorage.getItem("sf_ad_actions")||"0",10)||0; }
function _adLastShown(){ return parseInt(localStorage.getItem("sf_ad_last")||"0",10)||0; }
// Decide whether this study action should trigger an ad break.
function shouldShowAdBreak(){
  if(!state.showAds) return false;
  const p=state.adPacing||{every_actions:3,min_gap_seconds:150};
  const n=_adCount()+1; localStorage.setItem("sf_ad_actions",String(n));
  if(n % (p.every_actions||3) !== 0) return false;                 // not every action
  if(Date.now()-_adLastShown() < (p.min_gap_seconds||150)*1000) return false; // too soon
  return true;
}
// Show the ad break, then run `next()`. If no break is due, runs next() now.
function adGate(next){
  if(!shouldShowAdBreak()){ next(); return; }
  localStorage.setItem("sf_ad_last",String(Date.now()));
  const p=state.adPacing||{skip_after_seconds:5};
  let left=Math.max(0,p.skip_after_seconds||5);
  const ov=document.createElement("div"); ov.id="adgate";
  ov.innerHTML=`<div class="sheet">
     <div class="tag">Advertisement · quick break</div>
     <div class="adslot" id="adgate-slot"></div>
     <div class="gate-actions">
       <button class="btn ghost sm" id="adgate-upgrade">Remove ads</button>
       <button class="btn sm skip" id="adgate-skip" disabled>Continue in ${left}s</button>
     </div></div>`;
  document.body.appendChild(ov);
  renderAd(document.getElementById("adgate-slot"),"break");
  const skip=document.getElementById("adgate-skip");
  const close=()=>{ ov.remove(); };
  document.getElementById("adgate-upgrade").onclick=()=>{ close(); renderUpgrade(); };
  const done=()=>{ skip.disabled=false; skip.textContent="Continue ✓"; };
  if(left<=0){ done(); } else {
    const t=setInterval(()=>{ left--; if(left<=0){ clearInterval(t); done(); } else { skip.textContent=`Continue in ${left}s`; } },1000);
    onLeaveScreen(()=>clearInterval(t));
  }
  skip.onclick=()=>{ if(!skip.disabled){ close(); next(); } };
}
// Renders an ad into container `el` for a given slot, or a value-add upsell

     <div style="font-weight:600;margin-top:6px">Studying ad-free is one tap away</div>
     <div class="muted" style="font-size:13px;margin-top:2px">Upgrade to remove ads and unlock AI video lessons.</div>

    renderMathResult(r);

function renderMathResult(r){

    const blur=Array.from({length:Math.min(n,4)},(_,i)=>
      `<div class="mstep-blur">${esc(i===0&&r.teaser?r.teaser:"—————— —— ———— ————— —— ———— ——————")}</div>`).join("");
    steps=`<div class="msteps-lock">

        <div style="font-size:22px">${ICON.lock}</div>
        <div style="font-weight:700;font-size:15px;margin-top:2px">See how it's done</div>

        <button class="btn premium sm" id="math-up">Unlock the steps</button>
      </div></div>`;
  }else{
    steps=`<div class="mstep-head">How to solve it</div><ol class="msteps">
      ${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${r.check?`<div class="mcheck">✓ <b>Check it:</b> ${esc(r.check)}</div>`:""}`;
  }
  out.innerHTML=`<div class="card mathres">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div class="muted" style="font-size:12px;letter-spacing:.04em;text-transform:uppercase">Answer</div>${topic}</div>
    ${problem}

}

function trendChart(trend){
  const W=620,H=140,pad=24, pts=trend.slice(-20);
  if(pts.length<2){const v=pts[0]?pts[0].pct:0;return `<div class="muted">One data point so far: ${v}%. Take more quizzes to see a trend.</div>`;}
  const n=pts.length, dx=(W-2*pad)/(n-1);
  const xy=pts.map((p,i)=>[pad+i*dx, H-pad-(p.pct/100)*(H-2*pad)]);
  const line=xy.map((c,i)=>(i?"L":"M")+c[0].toFixed(1)+" "+c[1].toFixed(1)).join(" ");
  const dots=xy.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--brand)"><title>${pts[i].pct}% · ${esc(pts[i].title)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
     <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/>
     <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--border)"/>
     <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2"/>${dots}
     <text x="${pad-4}" y="${pad+4}" text-anchor="end" fill="var(--muted)" font-size="10">100</text>
     <text x="${pad-4}" y="${H-pad}" text-anchor="end" fill="var(--muted)" font-size="10">0</text>
   </svg>`;
}
function masteryRow(r){
  const col=MASTERY_COLOR[r.mastery]||"var(--muted)";
  const when=r.next_review?new Date(r.next_review):null;
  const sched=r.due?`<span style="color:var(--bad)">Due now</span>`:(when?`Next: ${when.toLocaleDateString()}`:"Not started");
  return `<div class="set-item" data-id="${r.id}" role="button" tabindex="0" style="cursor:pointer">
     <div><div style="font-weight:600">${esc(r.title)}</div>
       <div class="muted" style="font-size:12px">${sched}</div></div>
     <span class="pill" style="color:${col};border-color:${col}">${esc(r.mastery)}</span></div>`;
}

function handleFiles(fileList){
  const fs=Array.from(fileList);
  if(fs.length===1){ startFileUpload(fs[0]); return; }
  const form=new FormData(); fs.forEach(f=>form.append("files",f));
  startJob(()=>api("/uploads/multi",{method:"POST",form}), `${fs.length} files combined`);
}
function startFileUpload(f){const form=new FormData();form.append("file",f);startJob(()=>api("/uploads",{method:"POST",form}),f.name);}
async function startJob(createFn,label,isTopic){
  const job=document.getElementById("job");
  const msgs=isTopic?TOPIC_MSGS:GEN_MSGS;
  job.innerHTML=`<div class="card" style="text-align:center;margin-bottom:20px"><div class="spinner"></div>
     <div style="font-weight:700;margin-top:14px" id="gen-msg">${pick(msgs)}</div>
     <div class="muted" style="font-size:13px;margin-top:4px">${isTopic?"Researching ":""}“${esc(label)}” · this can take 30s–2 min</div>
     <div class="progress"><div id="bar" style="width:8%"></div></div></div>`;
  const gm=setInterval(()=>{const m=document.getElementById("gen-msg");if(m)m.textContent=pick(msgs);else clearInterval(gm);},2600);
  onLeaveScreen(()=>clearInterval(gm));
  try{
    const created=await createFn(); let pct=8, fails=0; const bar=()=>document.getElementById("bar");
    const poll=setInterval(async()=>{
      // The cleanup below is registered after the (awaited) create call, so if
      // the user navigates while the upload is still in flight it lands on the
      // NEXT screen's cleanup list and this keeps running. Bail out directly.
      if(!document.body.contains(job)){ clearInterval(poll); clearInterval(gm); return; }
      pct=Math.min(pct+7,90); if(bar())bar().style.width=pct+"%";
      let j;
      try{ j=await api("/jobs/"+created.id); fails=0; }
      catch{
        // A dropped connection used to be swallowed silently and the poll ran
        // forever behind a spinner that never resolved.
        if(++fails < 10) return;
        clearInterval(poll); clearInterval(gm);
        job.innerHTML=`<div class="card" style="margin-bottom:20px"><div style="font-weight:600;color:var(--bad)">Lost connection while building your study set</div>
          <div class="muted" style="margin-top:6px">It may still have finished — check your study sets, or try again.</div>
          <button class="btn ghost sm" id="job-dismiss" style="margin-top:14px">Dismiss</button></div>`;
        const dz=document.getElementById("job-dismiss"); if(dz) dz.onclick=()=>{job.innerHTML="";loadSets();};
        return;
      }
      if(j.status==="completed"){clearInterval(poll);clearInterval(gm);if(bar())bar().style.width="100%";job.innerHTML="";track("StudySetCreated",{},true);sendGame("set_created",{});await loadSets();openSet(j.study_set_id);}
      else if(j.status==="failed"){clearInterval(poll);clearInterval(gm);
        job.innerHTML=`<div class="card" style="margin-bottom:20px"><div style="font-weight:600;color:var(--bad)">Couldn’t create a study set</div>
          <div class="muted" style="margin-top:6px">${esc(j.error||"Unknown error")}</div>
          <button class="btn ghost sm" style="margin-top:14px" onclick="document.getElementById('job').innerHTML=''">Dismiss</button></div>`;}
    },1200);
    onLeaveScreen(()=>clearInterval(poll));
  }catch(e){clearInterval(gm);
    if(/upgrade|premium|free study sets/i.test(e.message||"")){ job.innerHTML=""; toast(e.message,"good"); renderUpgrade(); return; }
    job.innerHTML=`<div class="card" style="margin-bottom:20px"><div style="color:var(--bad);font-weight:600">Couldn’t start</div><div class="muted" style="margin-top:6px">${esc(e.message)}</div></div>`;}
}

async function openSet(id){
  shell(`<div class="center" style="min-height:40vh"><div class="spinner"></div></div>`);
  let s;
  try{ s=await api("/study-sets/"+id); }
  catch(e){
    // On a 401 api() already cleared the token and rendered the login form.
    // Calling shell() here painted the full app chrome over it — leaving a
    // logged-in-looking screen saying "please log in again" with no way to.
    if(!state.token) return;
    shell(`<p class="error">${esc(e.message)}</p>`);
    return;
  }
  if(state.showAds===undefined) await loadUsage();
  state.current=s; renderChooser();
}

        const inp=document.getElementById("share-link"); inp.select();
        // navigator.clipboard is undefined on any non-secure origin (e.g. the

        if(navigator.clipboard&&navigator.clipboard.writeText){

function modeShell(title){
  shell(`<a class="link" id="back" href="#" role="button">← Study options</a>
    <div class="row" style="justify-content:space-between;margin-top:12px">
      <h1 style="margin:0">${esc(title)}</h1><span class="pill">${esc(state.current.title)}</span></div>
    <div id="view" style="margin-top:16px"></div>`);
  document.getElementById("back").onclick=renderChooser;
  return document.getElementById("view");
}
function openMode(m){
  // Free users get a light, paced ad break before the study mode opens.
  adGate(()=>{
    _dispatchMode(m);
    // Reading/listening modes count as a small study session (once per set+mode).
    if(m==="guide"||m==="audio"||m==="video"){
      state._studySent=state._studySent||{};
      const k=state.current.id+":"+m;
      if(!state._studySent[k]){ state._studySent[k]=1; sendGame("study",{mode:m}); }
    }
  });
}
function _dispatchMode(m){
  if(m==="guide") return renderGuide();
  if(m==="audio") return renderAudio();
  if(m==="video") return renderVideo();
  if(m==="cards") return renderCards();
  if(m==="quiz")  return renderQuiz();
  if(m==="time")  return renderTimeAttack();
  if(m==="meteor") return renderMeteor();
  if(m==="ladder") return renderLadder();
  if(m==="test")  return renderTest();
  if(m==="match") return renderMatch();
}

// ---------- Read aloud ----------
async function renderAudio(){
  const v=modeShell("Read aloud");
  await loadVoiceOptions();
  if(window.speechSynthesis && !deviceVoices().length){ try{await new Promise(r=>{window.speechSynthesis.onvoiceschanged=r;setTimeout(r,500);});}catch{} }
  const text=state.current.summary.replace(/[#*_`>]/g," ").replace(/\s+/g," ").trim();
  const o=state.voiceOpts||{}; const ai=!!o.ai_available;
  v.innerHTML=`<div class="card">
     <div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
       <button class="btn" id="play">▶ Play</button>
       <button class="btn ghost" id="pause">⏸ Pause</button>
       <button class="btn ghost" id="stop">⏹ Stop</button>
       <button class="btn ghost sm" id="voice-btn" style="margin-left:auto">${ICON.volume} <span id="voice-name">${esc(currentVoiceLabel())}</span> ▾</button>
     </div>
     <div class="row" style="gap:10px;align-items:center;margin-top:10px">
       <span class="muted" style="font-size:13px">Speed</span>
       <input type="range" id="rate" min="0.7" max="1.5" step="0.1" value="1" style="flex:1;max-width:220px"/>
     </div>
     <div id="status" class="muted" style="margin-top:14px;font-size:14px">${ai?"Natural AI voice ready.":"Ready to read your notes aloud."}</div>
     <div class="notes" style="margin-top:16px;max-height:320px;overflow:auto">${mdLite(state.current.summary)}</div>
   </div>`;
  const status=document.getElementById("status");
  document.getElementById("voice-btn").onclick=renderSettings;
  let rate=1;

  if(ai){
    // ----- Studio AI voice: fetch MP3 chunks and play them back to back -----
    const voice=state.voicePref||savedVoice()||o.default;
    const chunks=speechChunks(text); const audio=new Audio(); audio.playbackRate=rate;
    let idx=0, urls={}, playing=false, stopped=false;
    const prefetch=async(i)=>{ if(i<chunks.length && !urls[i]){ try{urls[i]=await ttsFetch(chunks[i],voice,1);}catch(e){urls[i]=null; if(e.code===402){stopped=true;toast("You've used this month's free AI voice — upgrade for lots more","good");renderUpgrade();}} } };
    const playChunk=async(i)=>{
      if(i>=chunks.length){status.textContent="Finished.";playing=false;return;}
      status.textContent=`Reading… (${i+1}/${chunks.length})`;
      if(!urls[i]) await prefetch(i);
      if(stopped||!urls[i]){ if(!urls[i])status.textContent="Couldn’t load the voice — try again."; return; }
      audio.src=urls[i]; audio.playbackRate=rate; await audio.play().catch(()=>{});
      prefetch(i+1);
    };
    audio.onended=()=>{ if(stopped)return; idx++; playChunk(idx); };
    document.getElementById("play").onclick=async()=>{
      if(audio.paused && audio.src && !audio.ended){ audio.play(); status.textContent="Reading…"; return; }
      if(playing && !audio.paused) return;
      stopped=false; playing=true; if(!audio.src){ idx=0; } playChunk(idx);
    };
    document.getElementById("pause").onclick=()=>{ audio.pause(); status.textContent="Paused."; };
    document.getElementById("stop").onclick=()=>{ stopped=true; playing=false; audio.pause(); audio.currentTime=0; idx=0; status.textContent="Stopped."; };
    document.getElementById("rate").oninput=e=>{ rate=parseFloat(e.target.value); audio.playbackRate=rate; };
    state._stopAudio=()=>{ stopped=true; try{audio.pause();}catch{} };
    return;
  }

  // ----- Free device voice -----
  if(!("speechSynthesis" in window)){status.textContent="Your browser doesn’t support read-aloud. Try Safari or Chrome.";return;}
  const pickDeviceVoice=()=>{ const id=state.voicePref||savedVoice(); return deviceVoices().find(x=>x.name===id)||bestDeviceVoice(); };
  document.getElementById("rate").oninput=e=>{rate=parseFloat(e.target.value);};
  document.getElementById("play").onclick=()=>{
    if(window.speechSynthesis.paused){window.speechSynthesis.resume();status.textContent="Reading…";return;}
    stopSpeech();
    const u=new SpeechSynthesisUtterance(text); u.rate=rate;
    const vv=pickDeviceVoice(); if(vv)u.voice=vv;
    u.onend=()=>{status.textContent="Finished.";}; u.onstart=()=>{status.textContent="Reading…";};
    window.speechSynthesis.speak(u);
  };
  document.getElementById("pause").onclick=()=>{window.speechSynthesis.pause();status.textContent="Paused.";};
  document.getElementById("stop").onclick=()=>{stopSpeech();status.textContent="Stopped.";};

  // First-time nudge to pick a voice.
  try{
    if(!localStorage.getItem("sf_voice_prompted")){
      localStorage.setItem("sf_voice_prompted","1");
      setTimeout(()=>toast("🔊 Tip: tap the voice button to pick how your notes sound","good"),700);
    }
  }catch{}
}

// ---------- Video (narrated slideshow) ----------
function renderVideo(){
  const v=modeShell("Video");
  const raw=state.current.summary.replace(/[#*_`>]/g," ");
  const slides=raw.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>15);
  if(!slides.length) slides.push(state.current.title);
  let i=0,playing=false;
  v.innerHTML=`<div class="card">
     <div class="progress"><div id="vbar" style="width:0%"></div></div>
     <div class="slide" id="slide"></div>
     <div class="row" style="justify-content:center;gap:10px;margin-top:8px">
       <button class="btn ghost sm" id="prev">◀</button>
       <button class="btn" id="playpause">▶ Play</button>
       <button class="btn ghost sm" id="next">▶</button>
     </div>
     <div class="muted" style="text-align:center;font-size:13px;margin-top:8px" id="vcount"></div>
     <div class="muted" style="text-align:center;font-size:12px;margin-top:10px">Narrated by your Mac’s voice. High-definition AI video is a paid add-on we can switch on later.</div>
   </div>`;
  const slideEl=document.getElementById("slide"),bar=document.getElementById("vbar"),count=document.getElementById("vcount"),pp=document.getElementById("playpause");
  const draw=()=>{slideEl.textContent=slides[i];bar.style.width=((i+1)/slides.length*100)+"%";count.textContent=`Slide ${i+1} of ${slides.length}`;};
  const speakCurrent=()=>{
    if(!("speechSynthesis" in window))return;
    stopSpeech(); const u=new SpeechSynthesisUtterance(slides[i]); u.rate=1;
    u.onend=()=>{ if(playing){ if(i<slides.length-1){i++;draw();speakCurrent();} else {playing=false;pp.textContent="▶ Play";} } };
    window.speechSynthesis.speak(u);
  };
  pp.onclick=()=>{ if(playing){playing=false;stopSpeech();pp.textContent="▶ Play";} else {playing=true;pp.textContent="⏸ Pause";speakCurrent();} };
  // shell() calls speechSynthesis.cancel(), and per the Web Speech spec that
  // fires `end` on the utterance being spoken — so u.onend saw playing===true,
  // advanced a slide and spoke the next one, reading on through the notes on
  // whatever screen you'd navigated to. The read-aloud screen already guards
  // this with state._stopAudio; the video screen did not.
  state._stopAudio=()=>{ playing=false; try{stopSpeech();}catch{} };
  document.getElementById("prev").onclick=()=>{i=(i-1+slides.length)%slides.length;draw();if(playing)speakCurrent();};
  document.getElementById("next").onclick=()=>{i=(i+1)%slides.length;draw();if(playing)speakCurrent();};
  draw();

  // Premium: real AI video (metered).
  const prem=document.createElement("div"); prem.id="prem"; prem.style.marginTop="18px";
  v.appendChild(prem); renderPremium();
}

     </div>
     <div id="prem-action" style="margin-top:14px"></div>

  const wireGen=()=>{
    document.getElementById("gen-video").onclick=async()=>{
      const out=document.getElementById("gen-out");
      out.innerHTML=`<div class="spinner"></div><div class="muted" style="margin-top:8px">Starting your video — this can take a minute or two.</div>`;

        res=await fetch("/study-sets/"+s.id+"/video",{method:"POST",headers:{"Authorization":"Bearer "+state.token}});

        // No try/catch here meant a dropped connection rejected the handler and
        // the "Starting your video…" spinner span forever with no way out.

          <div class="muted" style="margin-top:6px">Check your connection and try again.</div>`;
        return;
      }
      if(res.status===402){ renderPremium(); return; }
      if(!res.ok){ const e=await res.json().catch(()=>({})); out.innerHTML=`<div style="color:var(--bad)">${esc((e.detail&&e.detail.message)||"Couldn’t start.")}</div>`; return; }

function showVideoHTML(v){
  if(v.url) return `<video controls playsinline style="width:100%;border-radius:12px" src="${esc(v.url)}"></video>`;
  // It used to say "Video ready ✓" for a placeholder with no video in it, on a
  // feature sold as "10 AI videos a month".
  return `<div style="font-weight:600">AI video isn't switched on yet</div>
     <div class="muted" style="margin-top:6px">${esc(v.note||"This is a preview of the narration. No video was generated and nothing was deducted from your allowance.")}</div>
     ${v.narration_script?`<div class="card" style="margin-top:12px;background:var(--surface-2)"><div class="muted" style="font-size:12px;margin-bottom:6px">Narration script</div>${esc(v.narration_script)}</div>`:""}`;
}
function pollVideo(out){
  const s=state.current;
  let ticks=0;
  const iv=setInterval(async()=>{
    // Was polling forever into a detached node once you navigated away.
    if(!document.body.contains(out) || ++ticks > 200){ clearInterval(iv); return; }
    let d; try{ d=await api("/study-sets/"+s.id+"/video"); }catch{ return; }
    const vv=d.video||{};
    if(vv.status==="ready"){ clearInterval(iv); state.current.video=vv; out.innerHTML=showVideoHTML(vv); }
    else if(vv.status==="failed"){ clearInterval(iv);
      out.innerHTML=`<div style="color:var(--bad);font-weight:600">Video didn’t generate</div>
        <div class="muted" style="margin-top:6px">${esc(vv.error||"")}</div>
        <div class="muted" style="font-size:12px;margin-top:6px">Your credit was refunded.</div>`;
    }
  },3000);
  onLeaveScreen(()=>clearInterval(iv));
}

// ---------- Quiz ----------
function renderQuiz(){
  const v=modeShell("Quiz"),s=state.current; let idx=0,score=0,answered=false; const missed=[];
  if(!s.quiz||!s.quiz.length) return emptyMode(v,"quiz");
  const draw=()=>{const q=s.quiz[idx];
    v.innerHTML=`<div class="progress"><div style="width:${idx/s.quiz.length*100}%"></div></div>
      <div class="card"><div class="muted" style="font-size:13px;font-weight:600">Question ${idx+1} of ${s.quiz.length}</div>
        <h2 style="margin:8px 0 16px">${esc(q.question)}</h2>
        <div id="choices">${q.choices.map((c,ci)=>`<button class="choice" data-i="${ci}">${esc(c)}</button>`).join("")}</div>
        <div id="cheer" class="cheer"></div>
        <div id="expl" class="muted" style="margin-top:6px"></div>
        <div id="teach-wrap" style="margin-top:10px"></div>
        <button class="btn hidden" id="next" style="margin-top:16px">${idx+1<s.quiz.length?"Next question →":"See results"}</button></div>`;
    answered=false;
    v.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      if(answered)return; answered=true; const chosen=+b.dataset.i,correct=q.answer_index;
      v.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(+x.dataset.i===correct)x.classList.add("correct");else if(+x.dataset.i===chosen)x.classList.add("wrong");});
      const cheer=document.getElementById("cheer");
      if(chosen===correct){score++;comboHit(b);
        cheer.className="cheer good"; cheer.textContent=_combo>=3?pick(CHEER_COMBO):pick(CHEER_CORRECT);
      }else{comboBreak(); cheer.className="cheer miss"; cheer.textContent=pick(CHEER_MISS);
        missed.push({question:q.question,choices:q.choices,correct:q.choices[correct],your_answer:q.choices[chosen]});}
      if(q.explanation)document.getElementById("expl").textContent=q.explanation;
      // Premium "Teach me this" for a deep breakdown of this question.
      const tw=document.getElementById("teach-wrap");
      tw.innerHTML=teachBtnHTML("teach-q","Teach me this",!isPaidPlan())+`<div id="teach-out-q" style="margin-top:10px"></div>`;
      document.getElementById("teach-q").onclick=ev=>runTutor("question",[{question:q.question,choices:q.choices,correct:q.choices[correct]}],document.getElementById("teach-out-q"),ev.currentTarget);
      document.getElementById("next").classList.remove("hidden");
    });
    document.getElementById("next").onclick=()=>{idx++;idx<s.quiz.length?draw():finish();};
  };
  const finish=async()=>{const pct=Math.round(score/s.quiz.length*100);
    comboBreak();
    const perfect=score===s.quiz.length&&s.quiz.length>=3;
    if(perfect) confetti(80);
    v.innerHTML=`<div class="card" style="text-align:center"><div style="font-weight:700;font-size:15px">${scoreLine(pct)}</div>
      <div class="big-score">${score}/${s.quiz.length}</div><div class="pill" style="margin-top:8px">${pct}%</div>
      <div id="quiz-xp" class="muted" style="margin-top:10px;font-size:14px"></div>
      <div style="margin-top:20px"><button class="btn" id="retry">Try again</button></div></div>
      <div id="review-wrap" style="margin-top:16px"></div>
      <div id="quizad" style="margin-top:16px"></div>`;
    document.getElementById("retry").onclick=()=>{idx=0;score=0;missed.length=0;draw();};
    if(missed.length){
      const paid=isPaidPlan();
      document.getElementById("review-wrap").innerHTML=`<div class="card" style="border-color:rgba(47,111,237,.4)">
        <div style="font-weight:800;font-size:16px">${ICON.book} Personalized review</div>
        <div class="muted" style="font-size:13px;margin:4px 0 12px">${paid?`Get a tutor breakdown of the ${missed.length} question${missed.length>1?"s":""} you missed — why you missed ${missed.length>1?"them":"it"}, and how to remember.`:"Premium turns your wrong answers into a personal tutor session — why you missed each one, and how to lock it in."}</div>
        ${teachBtnHTML("do-review","Review what I missed",!paid)}
        <div id="review-out" style="margin-top:12px"></div></div>`;
      document.getElementById("do-review").onclick=ev=>runTutor("review",missed,document.getElementById("review-out"),ev.currentTarget);
    }
    sendGame("quiz",{score,total:s.quiz.length},document.getElementById("quiz-xp")).then(r=>{
      const x=document.getElementById("quiz-xp");
      if(x&&r) x.innerHTML=`<span style="color:var(--brand-ink);font-weight:700">+${r.gained_xp} XP</span>${perfect?" · perfect bonus included!":""}`;
    });
    if(state.showAds===undefined) await loadUsage();
    renderAd(document.getElementById("quizad"),"quiz");
    try{await api("/study-sets/"+s.id+"/quiz/attempts",{method:"POST",body:{score,total:s.quiz.length}});}catch{}
  }; draw();
}

// ---------- Time Attack (timed quiz + high score) ----------
function renderTimeAttack(){
  const v=modeShell("Time Attack"),s=state.current;
  if(!s.quiz||!s.quiz.length) return emptyMode(v,"play");
  const DURATION=45, key="sf_ta_"+s.id;
  const best=parseInt(localStorage.getItem(key)||"0",10);
  v.innerHTML=`<div class="card" style="text-align:center">
     <div style="font-size:15px">Answer as many as you can in <b>${DURATION} seconds</b>.</div>
     <div class="muted" style="margin-top:6px">Best score to beat: <b>${best}</b></div>
     <button class="btn" id="start" style="margin-top:16px">Start</button></div>`;
  document.getElementById("start").onclick=run;
  function run(){
    let time=DURATION, score=0, order=[...s.quiz.keys()], i=0, done=false;
    for(let j=order.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]];}
    const tick=setInterval(()=>{time--; const tEl=document.getElementById("ta-time"); if(tEl)tEl.textContent=time; if(time<=0)finish();},1000);
    // Leaving mid-game used to leave this running: 45s later it wrote a score,
    // fired confetti onto whatever screen you were now on, and then threw.
    onLeaveScreen(()=>clearInterval(tick));
    const draw=()=>{
      const q=s.quiz[order[i%order.length]];
      v.innerHTML=`<div class="row" style="justify-content:space-between"><span class="pill">Score: <b id="ta-score">${score}</b></span><span class="pill">⏱ <b id="ta-time">${time}</b>s</span></div>
        <div class="card" style="margin-top:12px"><h2 style="margin:0 0 14px">${esc(q.question)}</h2>
          <div id="ta-choices">${q.choices.map((c,ci)=>`<button class="choice" data-i="${ci}">${esc(c)}</button>`).join("")}</div></div>`;
      v.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
        if(done)return;
        const ok=+b.dataset.i===q.answer_index;
        b.classList.add(ok?"correct":"wrong");
        if(ok){score++; const sc=document.getElementById("ta-score"); if(sc)sc.textContent=score; comboHit(b);}else{comboBreak(); floatXP("✗",b);}
        v.querySelectorAll(".choice").forEach(x=>x.disabled=true);
        setTimeout(()=>{ if(!done){ i++; draw(); } },300);
      });
    };
    const finish=()=>{
      if(done)return; done=true; clearInterval(tick); comboBreak();
      const isBest=score>best; if(isBest){localStorage.setItem(key,String(score)); confetti(60);}
      v.innerHTML=`<div class="card" style="text-align:center">
        <div class="muted" style="font-weight:600">Time!</div>
        <div class="big-score">${score}</div>
        ${isBest?`<div class="pill" style="color:var(--good);border-color:var(--good);margin-top:8px">🎉 New best!</div>`
                :`<div class="muted" style="margin-top:8px">Best: ${best}</div>`}
        <div id="ta-xp" class="muted" style="margin-top:10px;font-size:14px"></div>
        <div style="margin-top:20px"><button class="btn" id="again">Play again</button></div></div>`;
      document.getElementById("again").onclick=run;
      sendGame("time_attack",{score,total:Math.max(score,i)||1},document.getElementById("ta-xp")).then(r=>{
        const x=document.getElementById("ta-xp");
        if(x&&r) x.innerHTML=`<span style="color:var(--brand-ink);font-weight:700">+${r.gained_xp} XP</span>`;
      });
    };
    draw();
  }
}

// ---------- Meteor Blitz (falling-question arcade, high score) ----------
function renderMeteor(){
  const v=modeShell("Meteor Blitz"), s=state.current;
  if(!s.quiz||!s.quiz.length){ v.innerHTML=`<div class="card">This set has no quiz questions to play with yet.</div>`; return; }
  const key="sf_mb_"+s.id; let best=parseInt(localStorage.getItem(key)||"0",10);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

  function start(){
    let score=0, lives=3, combo=0, answered=0, correct=0, order=[], oi=0, missTimer=null, gameOn=true;
    v.innerHTML=`<div class="mb-hud">
        <span>${ICON.star} <span id="mb-score">0</span></span>
        <span class="mb-combo" id="mb-combo"></span>
        <span class="lives" id="mb-lives"></span></div>
      <div class="mb-field" id="mb-field"></div>
      <div class="mb-choices" id="mb-choices"></div>
      <div class="muted" style="text-align:center;margin-top:8px;font-size:12px">Tap the answer before the meteor lands · Best ${best}</div>`;
    const field=()=>document.getElementById("mb-field");
    const fallSecs=()=>Math.max(2.2, 5.5 - Math.floor(score/60)*0.4);  // ramps up with score

    function spawn(){
      if(!gameOn) return;
      if(oi>=order.length){ order=shuffle([...s.quiz.keys()]); oi=0; }
      const q=s.quiz[order[oi++]], f=field(); if(!f) return;
      const m=document.createElement("div"); m.className="meteor"; m.textContent=q.question; f.appendChild(m);
      const dur=fallSecs();
      requestAnimationFrame(()=>{ m.style.transition=`top ${dur}s linear`; m.style.top=(f.clientHeight-12)+"px"; });
      const cbox=document.getElementById("mb-choices");
      cbox.innerHTML=q.choices.map((c,i)=>`<button class="mb-choice" data-i="${i}">${esc(c)}</button>`).join("");
      let done=false;
      const resolve=(ok,btn)=>{
        if(done) return; done=true; clearTimeout(missTimer);
        const r=m.getBoundingClientRect(), fr=f.getBoundingClientRect();
        const bx=r.left-fr.left+r.width/2, by=Math.min(f.clientHeight-8, r.top-fr.top+r.height/2);
        m.remove();
        if(ok){
          combo++; correct++;
          const mult=Math.min(5, 1+Math.floor(combo/2));
          const pts=10*mult; score+=pts;
          boom(bx,by);
          const sc=document.getElementById("mb-score"); if(sc)sc.textContent=score;
          const cc=document.getElementById("mb-combo"); if(cc)cc.textContent=combo>1?("🔥 x"+mult):"";
          if(btn) floatXP("+"+pts,btn);
        }else{
          combo=0; lives--; shake();
          const lv=document.getElementById("mb-lives"); if(lv)lv.innerHTML=`<span class="life">${ICON.heart}</span>`.repeat(Math.max(0,lives))+`<span class="life off">${ICON.heart}</span>`.repeat(3-Math.max(0,lives));
          const cc=document.getElementById("mb-combo"); if(cc)cc.textContent="";
        }
        answered++;
        if(lives<=0){ return over(); }
        spawn();
      };
      cbox.querySelectorAll(".mb-choice").forEach(b=>b.onclick=()=>resolve(+b.dataset.i===q.answer_index,b));
      missTimer=setTimeout(()=>resolve(false,null), dur*1000+60);
    }
    function boom(x,y){
      const f=field(); if(!f) return;
      const colors=["#ff8a5b","#ffd166","#ff5c9d","#2f6fed","#fff"];
      for(let i=0;i<14;i++){ const p=document.createElement("div"); p.className="mb-boom";
        p.style.left=x+"px"; p.style.top=y+"px"; p.style.background=colors[i%colors.length];
        const a=Math.random()*6.283, d=28+Math.random()*46;
        p.style.setProperty("--dx",(Math.cos(a)*d)+"px"); p.style.setProperty("--dy",(Math.sin(a)*d)+"px");
        f.appendChild(p); setTimeout(()=>p.remove(),520);
      }
    }
    function shake(){ const f=field(); if(f){ f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); } }
    function over(){
      gameOn=false; clearTimeout(missTimer);
      const isBest=score>best; if(isBest){ best=score; try{localStorage.setItem(key,String(best));}catch{} confetti(70); }
      v.innerHTML=`<div class="card" style="text-align:center">
        <div class="muted" style="font-weight:700">${ICON.meteor} Game over</div>
        <div class="big-score">${score}</div>
        ${isBest?`<div class="pill" style="color:var(--good);border-color:var(--good);margin-top:8px">🎉 New high score!</div>`:`<div class="muted" style="margin-top:8px">Best: ${best}</div>`}
        <div id="mb-xp" class="muted" style="margin-top:10px;font-size:14px"></div>
        <div style="margin-top:20px"><button class="btn" id="mb-again">Play again</button></div></div>`;
      document.getElementById("mb-again").onclick=start;
      sendGame("time_attack",{score:correct,total:Math.max(correct,answered)||1},document.getElementById("mb-xp")).then(r=>{
        const x=document.getElementById("mb-xp"); if(x&&r) x.innerHTML=`<span style="color:var(--brand-ink);font-weight:700">+${r.gained_xp} XP</span>`;
      });
    }
    spawn();
  }

  v.innerHTML=`<div class="card" style="text-align:center">
    <div style="font-size:36px">${ICON.meteor}</div>
    <div style="font-weight:800;font-size:19px;margin-top:4px">Meteor Blitz</div>
    <div class="muted" style="margin:8px auto 0;max-width:340px;font-size:14px">Questions rain down as meteors. Tap the right answer before each one lands. Chain correct answers for <b>combo multipliers</b> — the faster you go, the faster they fall. 3 lives. How high can you score?</div>
    <div class="muted" style="margin-top:12px">Best: <b>${best}</b></div>
    <button class="btn" id="mb-start" style="margin-top:16px">Start</button></div>`;
  document.getElementById("mb-start").onclick=start;
}

// ---------- Streak Ladder (one life, climb as high as you can) ----------
function renderLadder(){
  const v=modeShell("Streak Ladder"), s=state.current;
  if(!s.quiz||!s.quiz.length){ v.innerHTML=`<div class="card">This set has no quiz questions to play with yet.</div>`; return; }

  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

  function start(){
    let score=0, order=shuffle([...s.quiz.keys()]), oi=0, raf=null, over=false;
    const secs=()=>Math.max(2.2, 5 - Math.floor(score/5)*0.35);  // less time as you climb
    function draw(){
      if(oi>=order.length){ order=shuffle([...s.quiz.keys()]); oi=0; }
      const q=s.quiz[order[oi++]];
      v.innerHTML=`<div class="sl-timer"><div id="sl-bar"></div></div>
        <div class="row" style="justify-content:space-between;align-items:center">
          <span class="pill">${ICON.ladder} Rung <b>${score}</b></span>
          <span class="muted" style="font-size:13px">Best: ${best}</span></div>
        <div class="card" style="margin-top:12px"><h2 style="margin:0 0 14px">${esc(q.question)}</h2>
          <div class="mb-choices">${q.choices.map((c,i)=>`<button class="mb-choice" data-i="${i}">${esc(c)}</button>`).join("")}</div></div>`;
      const dur=secs()*1000, tEnd=performance.now()+dur, bar=document.getElementById("sl-bar");
      const tick=()=>{ const left=Math.max(0,(tEnd-performance.now())/dur); if(bar)bar.style.width=(left*100)+"%";
        if(left<=0){ return end(); } raf=requestAnimationFrame(tick); };
      raf=requestAnimationFrame(tick);
      onLeaveScreen(()=>cancelAnimationFrame(raf));
      let done=false;
      v.querySelectorAll(".mb-choice").forEach(b=>b.onclick=()=>{
        if(done)return; done=true; cancelAnimationFrame(raf);
        if(+b.dataset.i===q.answer_index){ score++; floatXP(ICON.arrowUp+" +1",b); draw(); }
        else{ b.style.borderColor="var(--bad)"; b.style.background="rgba(255,92,124,.14)"; setTimeout(end,260); }
      });
    }
    function end(){
      if(over)return; over=true; cancelAnimationFrame(raf);
      const isBest=score>best; if(isBest){ best=score; try{localStorage.setItem(key,String(best));}catch{} confetti(70); }
      v.innerHTML=`<div class="card" style="text-align:center">
        <div class="muted" style="font-weight:700">${ICON.ladder} You reached rung</div>
        <div class="big-score">${score}</div>
        ${isBest?`<div class="pill" style="color:var(--good);border-color:var(--good);margin-top:8px">🎉 New high score!</div>`:`<div class="muted" style="margin-top:8px">Best: ${best}</div>`}
        <div id="sl-xp" class="muted" style="margin-top:10px;font-size:14px"></div>
        <div style="margin-top:20px"><button class="btn" id="sl-again">Play again</button></div></div>`;
      document.getElementById("sl-again").onclick=start;
      sendGame("time_attack",{score:score,total:Math.max(1,score)},document.getElementById("sl-xp")).then(r=>{
        const x=document.getElementById("sl-xp"); if(x&&r) x.innerHTML=`<span style="color:var(--brand-ink);font-weight:700">+${r.gained_xp} XP</span>`;
      });
    }
    draw();
  }

  v.innerHTML=`<div class="card" style="text-align:center">
    <div style="font-size:36px">${ICON.ladder}</div>
    <div style="font-weight:800;font-size:19px;margin-top:4px">Streak Ladder</div>
    <div class="muted" style="margin:8px auto 0;max-width:340px;font-size:14px">Answer to climb the ladder — each rung gives you <b>less time</b> than the last. One wrong answer, or the clock running out, ends your run. How high can you climb?</div>
    <div class="muted" style="margin-top:12px">Best: <b>${best}</b></div>
    <button class="btn" id="sl-start" style="margin-top:16px">Start climbing</button></div>`;
  document.getElementById("sl-start").onclick=start;
}

    if(missed.length){
      const paid=isPaidPlan();
      document.getElementById("test-review").innerHTML=`<div class="card" style="border-color:rgba(47,111,237,.4)">
        <div style="font-weight:800;font-size:16px">${ICON.book} Personalized review</div>
        <div class="muted" style="font-size:13px;margin:4px 0 12px">${paid?`Get a step-by-step tutor review of the ${missed.length} you missed.`:"Premium turns everything you missed into a personal tutor session — why, and how to get it right next time."}</div>
        ${teachBtnHTML("test-do-review","Review what I missed",!paid)}
        <div id="test-review-out" style="margin-top:12px"></div></div>`;
      document.getElementById("test-do-review").onclick=ev=>runTutor("review",missed,document.getElementById("test-review-out"),ev.currentTarget);
    }
  };
  v.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    document.getElementById("ans-"+i).innerHTML=`<strong>Answer:</strong> ${esc(s.test[i].answer)}`;
    if(s.test[i].kind!=="true_false" && !seen.has(i)){
      const inp=v.querySelector('.ans[data-i="'+i+'"]');
      const val=((inp&&inp.value)||"").trim().toLowerCase(), ans=(s.test[i].answer||"").trim().toLowerCase();
      if(!val || (val!==ans && ans.indexOf(val)===-1 && val.indexOf(ans)===-1))
        missed.push({question:s.test[i].question,correct:s.test[i].answer,your_answer:(inp&&inp.value.trim())||"(left blank)"});
    }
    seen.add(i); injectTeach(i); maybeFinish();
  });
  v.querySelectorAll(".tf").forEach(b=>b.onclick=()=>{
    // The model can answer "true", "TRUE" or "True." — a raw === against the
    // button's "True"/"False" marked both choices wrong.
    const _n=x=>String(x==null?"":x).trim().toLowerCase().replace(/[.\s]+$/,"");
    const i=+b.dataset.i,ok=_n(b.dataset.v)===_n(s.test[i].answer);
    if(!seen.has(i)){ if(ok){tfCorrect++;comboHit(b);}else{comboBreak();missed.push({question:s.test[i].question,correct:s.test[i].answer,your_answer:b.dataset.v});} }
    seen.add(i);
    document.getElementById("ans-"+i).innerHTML=(ok?'<span style="color:var(--good)">Correct!</span> ':'<span style="color:var(--bad)">Not quite.</span> ')+`Answer: ${esc(s.test[i].answer)}`;
    injectTeach(i); maybeFinish();
  });
}

// ---------- Matching game ----------
function renderMatch(){
  const v=modeShell("Matching game"),s=state.current;
  if(!s.matching||!s.matching.length) return emptyMode(v,"match");
  const pairs=s.matching.slice(0,8);
  const terms=pairs.map((p,i)=>({t:p.term,i}));
  const defs=pairs.map((p,i)=>({d:p.definition,i})).sort(()=>Math.random()-0.5);
  let sel=null,done=0;
  v.innerHTML=`<div class="card"><div class="muted" style="font-size:14px">Click a term, then its matching definition.</div>
     <div class="match-cols">
       <div id="terms">${terms.map(x=>`<div class="match-item term" role="button" tabindex="0" data-i="${x.i}">${esc(x.t)}</div>`).join("")}</div>
       <div id="defs">${defs.map(x=>`<div class="match-item def" role="button" tabindex="0" data-i="${x.i}">${esc(x.d)}</div>`).join("")}</div>
     </div>
     <div id="mstatus" class="muted" style="margin-top:14px"></div></div>`;
  const status=document.getElementById("mstatus");
  const clickTerm=e=>{if(e.target.classList.contains("done"))return;v.querySelectorAll(".term").forEach(t=>t.classList.remove("sel"));e.target.classList.add("sel");sel=e.target.dataset.i;};
  const clickDef=e=>{
    if(e.target.classList.contains("done")||sel===null)return;
    if(e.target.dataset.i===sel){
      const term=v.querySelector(`.term[data-i="${sel}"]`);
      term.classList.remove("sel");term.classList.add("done");e.target.classList.add("done");
      floatXP("✓",e.target);
      sel=null;done++;
      if(done===pairs.length){
        status.innerHTML='<span style="color:var(--good);font-weight:600">All matched! 🎉</span> <span id="match-xp" class="muted"></span>';
        confetti(50);
        sendGame("match",{pairs:pairs.length},status).then(r=>{
          const x=document.getElementById("match-xp");
          if(x&&r) x.innerHTML=`<span style="color:var(--brand-ink);font-weight:700">+${r.gained_xp} XP</span>`;
        });
      }
    }else{
      const bad=e.target;bad.classList.add("bad");setTimeout(()=>bad.classList.remove("bad"),500);
      status.textContent="Not a match — try again.";
    }
  };
  v.querySelectorAll(".term").forEach(t=>t.onclick=clickTerm);
  v.querySelectorAll(".def").forEach(d=>d.onclick=clickDef);
}

// ---------- Sharing / import ----------
async function showImport(token){
  const host=document.getElementById("due")||document.getElementById("job"); if(!host)return;
  let p; try{p=await api("/shared/"+token);}catch(e){ host.innerHTML=`<div class="card" style="margin-bottom:16px"><div style="color:var(--bad);font-weight:600">Shared set not found</div><div class="muted" style="margin-top:6px">The link may be broken or the set was removed.</div></div>`; state.pendingShare=null; return; }
  const c=p.counts;
  host.innerHTML=`<div class="card" style="margin-bottom:16px;border-color:var(--brand)">
     <div style="font-weight:700">${ICON.inbox} A study set was shared with you</div>
     <div style="font-size:18px;font-weight:700;margin-top:8px">${esc(p.title)}</div>
     <div class="muted" style="font-size:13px;margin-top:4px">${c.flashcards} flashcards · ${c.quiz} quiz · ${c.test} test · ${c.matching} matching</div>
     <div class="row" style="gap:8px;margin-top:14px">
       <button class="btn" id="imp-add">Add to my library</button>
       <button class="btn ghost" id="imp-no">Dismiss</button></div></div>`;
  document.getElementById("imp-no").onclick=()=>{state.pendingShare=null;history.replaceState({},"",location.pathname);host.innerHTML="";};
  document.getElementById("imp-add").onclick=async()=>{
    try{const r=await api("/shared/"+token+"/import",{method:"POST"});state.pendingShare=null;history.replaceState({},"",location.pathname);toast("Added to your library ✓","good");await loadSets();openSet(r.id);}
    catch(e){toast(e.message,"bad");}
  };
}

// Don't sell a feature that isn't switched on. SF_FLAGS is injected by the
// server (see main._feature_flags_snippet) so this works logged-out too.
function applyFeatureFlags(){
  const live=!!(window.SF_FLAGS&&window.SF_FLAGS.videoLive);
  if(!live) document.querySelectorAll(".vid-line").forEach(e=>e.remove());
}

// ---------- boot ----------
try{applyThemeEarly(localStorage.getItem("sf_theme_id"));}catch{}
const _params=new URLSearchParams(location.search);
state.pendingShare=_params.get("s");
const _checkout=_params.get("checkout");
if(_checkout==="success") track("Purchase",{currency:"USD",value:0,content_name:"StudyForge subscription"});
if(_checkout){ history.replaceState({},"",location.pathname); }
if(_checkout==="cancel") setTimeout(()=>toast("Checkout canceled",""),400);
// Stripe sends the browser back the moment the card clears, but the webhook
// that actually flips the plan can land seconds later. The old code just said
// "your account is updated ✓" and never looked again — so the very first thing
// a paying customer saw was the free tier, ads and all.
if(_checkout==="success"){
  (async()=>{
    for(let i=0;i<12;i++){
      await loadUsage(true);
      if(isPaidPlan()){ toast("Payment complete — Premium is on ✓","good"); return; }
      await new Promise(r=>setTimeout(r,1500));
    }
    toast("Payment received — activating your plan. Refresh in a moment.","good");
  })();
}
// Reset links now arrive as "#reset=<token>" so the credential is never sent
// to a server, an access log, Meta Pixel or GA. Links emailed before that
// change used "?reset=" — still honoured, but scrubbed from the URL at once
// rather than after a successful reset (it used to sit there while the
// analytics tags read location.href).
let _resetToken=null;
const _hashMatch=(location.hash||"").match(/^#reset=(.+)$/);
if(_hashMatch){ _resetToken=decodeURIComponent(_hashMatch[1]); history.replaceState({},"",location.pathname); }
else if(_params.get("reset")){ _resetToken=_params.get("reset"); history.replaceState({},"",location.pathname); }
if(_resetToken) renderReset(_resetToken);
else if(state.token) renderHome();
else if(state.pendingShare) renderAuth("signup");
else renderLanding();
renderCookieBar();
applyFeatureFlags();
</script>
